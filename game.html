<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RecToom — Jeu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login UI -->
  <div class="login-bg"></div>
  <div class="login-overlay"></div>
  <div class="login-card" role="main" aria-labelledby="welcome-title">
    <h1 id="welcome-title">RecToom</h1>
    <p>Bienvenue — connecte‑toi puis clique « Jouer » pour commencer.</p>
    <button id="play-btn">Jouer</button>
    <button id="mute-btn" aria-pressed="false">🔊</button>
  </div>

  <!-- Audio elements (placeholders) -->
  <audio id="theme-audio" src="assets/audio/recroom-theme.mp3" loop preload="auto"></audio>
  <audio id="intro-audio" src="assets/audio/recroom-intro.mp3" preload="auto"></audio>

  <!-- Existing game script (if present) -->
  <script src="game.js"></script>
  <!-- Login UI script -->
  <script src="login-ui.js"></script>
</body>
</html>
